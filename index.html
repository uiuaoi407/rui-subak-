<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>전가서의 수박 게임 챌린지!</title>
    
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
            }
        });
    </script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #000; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 12px 0; font-size: 20px;}
        
        #game-container { 
            position: relative; width: 85vw; max-width: 390px; height: 72vh; 
            background-color: #000; background-size: cover; background-position: center;
            margin: 10px auto; border: 3px solid #555; border-radius: 10px; overflow: hidden; 
            touch-action: none; transition: background-image 0.5s ease;
        }

        .fruit-drop { 
            position: absolute; border-radius: 50%; border: 2px solid white; background-size: cover; background-position: center; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: black;
            transform: translate(-50%, -50%);
        }

        #score-board { font-size: 16px; font-weight: bold; margin-bottom: 12px; z-index: 2; position: relative; }
        #watermark { position: absolute; bottom: 10px; right: 12px; color: rgba(255, 255, 255, 0.6); font-size: 12px; z-index: 6; pointer-events: none; }

        .screen-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0, 0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; 
        }
        button { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
        .copyright-text { margin-top: 15px; font-size: 11px; color: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>
    <h1>🍉 전가서 수박게임 챌린지 🍉</h1>
    <div id="score-board">점수: <span id="score">0</span></div>

    <audio id="bgm" src="수박배경음악.mp3" loop></audio>
    <div id="game-container">
        <div id="watermark">모카크림의 밤산책</div>
        <div id="start-screen" class="screen-overlay">
            <h2>수박 챌린지 시작</h2>
            <button onclick="firstStartGame()">게임 시작!</button>
            <div class="copyright-text">© 2026 모카크림의밤산책. Fan-made project.</div>
        </div>
        <div id="game-over" class="screen-overlay" style="display: none;">
            <h2>게임 오버 😵</h2>
            <p id="final-score"></p>
            <button onclick="restartGame()">다시 시작하기</button>
        </div>
    </div>

<script>
    const container = document.getElementById("game-container");
    const scoreEl = document.getElementById("score");
    const bgm = document.getElementById("bgm");

    const fruitTypes = [
        { level: 1, radius: 18, score: 2, img: 'subak1.jpg' },
        { level: 2, radius: 25, score: 4, img: 'subak2.jpg' },
        { level: 3, radius: 33, score: 8, img: 'subak3.jpg' },
        { level: 4, radius: 42, score: 16, img: 'subak4.jpg' },
        { level: 5, radius: 53, score: 32, img: 'subak5.jpg' },
        { level: 6, radius: 66, score: 64, img: 'subak6.jpg' },
        { level: 7, radius: 82, score: 128, img: 'subak7.jpg' }
    ];

    let score = 0;
    let isGameRunning = false;
    let balls = [];
    let currentDropLevel = 0;
    let canDrop = true;
    let gameInterval = null;
    let gameOverTimer = 0;

    function updateBackground() {
        let bgIdx = (Math.floor(score / 1000) % 5) + 1;
        container.style.backgroundImage = `url('배경${bgIdx}.jpg')`;
    }

    function playBgm() { bgm.pause(); bgm.currentTime = 0; bgm.play().catch(() => {}); }
    function firstStartGame() { document.getElementById("start-screen").style.display = "none"; playBgm(); runGame(); }
    function restartGame() { document.getElementById("game-over").style.display = "none"; playBgm(); runGame(); }

    function runGame() {
        score = 0;
        scoreEl.innerText = "0";
        updateBackground();
        isGameRunning = true;
        balls.forEach(b => b.element.remove());
        balls = [];
        currentDropLevel = getRandomDropLevel();
        canDrop = true;
        gameOverTimer = 0;
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(updatePhysics, 1000 / 60);
    }

    function getRandomDropLevel() {
        const rand = Math.random();
        if (rand < 0.35) return 0; else if (rand < 0.75) return 1; else return 2;
    }

    container.addEventListener("click", (e) => {
        if (!isGameRunning || !canDrop) return;
        const rect = container.getBoundingClientRect();
        dropBall(e.clientX - rect.left, currentDropLevel);
    });

    container.addEventListener("touchend", (e) => {
        if (!isGameRunning || !canDrop) return;
        const rect = container.getBoundingClientRect();
        dropBall(e.changedTouches[0].clientX - rect.left, currentDropLevel);
        e.preventDefault();
    }, {passive: false});

    function dropBall(x, levelIdx) {
        canDrop = false;
        const type = fruitTypes[levelIdx];
        createBall(Math.max(type.radius, Math.min(x, container.clientWidth - type.radius)), type.radius + 5, type, 0, 0);
        setTimeout(() => { canDrop = true; currentDropLevel = getRandomDropLevel(); }, 800);
    }

    function createBall(x, y, type, vx, vy) {
        const el = document.createElement("div");
        el.className = "fruit-drop";
        el.style.width = (type.radius * 2) + "px";
        el.style.height = (type.radius * 2) + "px";
        el.style.backgroundImage = `url('${type.img}')`;
        container.appendChild(el);
        balls.push({ element: el, x, y, vx, vy, radius: type.radius, level: type.level, scoreVal: type.score });
    }

    function updatePhysics() {
        if (!isGameRunning) return;
        const gravity = 0.35;
        const width = container.clientWidth, height = container.clientHeight;

        let isOverflowing = false;

        // 1. 위치 및 속도 업데이트 (마찰력 및 미끄러짐 구현)
        for (let b of balls) {
            b.vy += gravity;
            b.x += b.vx;
            b.y += b.vy;

            // 공기 저항 및 바닥/벽 마찰 계수 조정
            b.vx *= 0.98;
            b.vy *= 0.99;

            if (Math.abs(b.vx) < 0.01) b.vx = 0;
            if (Math.abs(b.vy) < 0.01) b.vy = 0;

            // 좌우 벽 충돌
            if (b.x - b.radius < 0) { b.x = b.radius; b.vx = 0; }
            if (b.x + b.radius > width) { b.x = width - b.radius; b.vx = 0; }

            // 바닥 충돌
            if (b.y + b.radius > height) { 
                b.y = height - b.radius; 
                b.vy = 0; 
            }

            if (b.y - b.radius < 35 && b.vy === 0 && Math.abs(b.vx) < 0.1) {
                isOverflowing = true;
            }
        }

        if (isOverflowing) {
            gameOverTimer++;
            if (gameOverTimer > 90) { 
                isGameRunning = false; 
                clearInterval(gameInterval); 
                bgm.pause(); 
                document.getElementById("final-score").innerText = `최종 점수 : ${score}점`; 
                document.getElementById("game-over").style.display = "flex"; 
                return; 
            }
        } else {
            gameOverTimer = Math.max(0, gameOverTimer - 1);
        }

        // 2. 비탄성 당구공 충돌 및 미끄러짐(틈새 파고들기) 연산
        let merged = new Set();
        
        for (let iter = 0; iter < 8; iter++) {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    if (merged.has(i) || merged.has(j)) continue;
                    let b1 = balls[i], b2 = balls[j];
                    let dx = b2.x - b1.x; 
                    let dy = b2.y - b1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = b1.radius + b2.radius;

                    if (dist < minDist) {
                        // 같은 레벨일 경우 합치기 조건 처리
                        if (b1.level === b2.level) {
                            merged.add(i); merged.add(j);
                            score += b1.scoreVal * 2;
                            scoreEl.innerText = score;
                            updateBackground();
                            
                            // 7단계(만렙) 공 두 개가 만나면 터지면서 소멸 (다음 단계로 생성 안 함)
                            if (b1.level < 7) {
                                spawnMergedBall((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, b1.level + 1);
                            }
                        } else {
                            // 비탄성 충돌: 겹침을 해소하고 미끄러지며 중력/사선 방향으로 흘러내리는 물리 적용
                            let overlap = minDist - dist;
                            let nx = dx / (dist || 1); 
                            let ny = dy / (dist || 1);

                            let m1 = b1.radius;
                            let m2 = b2.radius;
                            let totalM = m1 + m2;

                            // 크기에 따른 위치 분배 (무거운 공은 덜 밀리고 가벼운 공은 잘 밀림)
                            b1.x -= nx * overlap * (m2 / totalM);
                            b1.y -= ny * overlap * (m2 / totalM);
                            b2.x += nx * overlap * (m1 / totalM);
                            b2.y += ny * overlap * (m1 / totalM);

                            // 미끄러짐 및 경사면 타고 흐르는 성질 부여 (탄성 최소화)
                            let kx = b2.vx - b1.vx;
                            let ky = b2.vy - b1.vy;
                            let p = 2 * (nx * kx + ny * ky) / 2;

                            if (p < 0) {
                                b1.vx += p * nx * 0.2;
                                b1.vy += p * ny * 0.2;
                                b2.vx -= p * nx * 0.2;
                                b2.vy -= p * ny * 0.2;
                            }
                        }
                    }
                }
            }
        }

        // 3. 화면 반영 및 삭제 처리
        balls = balls.filter((b, idx) => {
            if (merged.has(idx)) { 
                b.element.remove(); 
                return false; 
            }
            b.element.style.left = b.x + "px"; 
            b.element.style.top = b.y + "px";
            return typeValidation(b);
        });
    }

    function typeValidation(b) {
        return !isNaN(b.x) && !isNaN(b.y);
    }

    function spawnMergedBall(x, y, level) { 
        createBall(x, y, fruitTypes[level - 1], (Math.random() - 0.5) * 0.5, -2); 
    }
</script>
</body>
</html>
