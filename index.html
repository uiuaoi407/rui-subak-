<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>전가서의 수박 게임 챌린지!</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
            }
        });
    </script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #000; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 8px 0; font-size: 18px;}
        
        /* 상단 정보 패널 (점수 & 다음 과일 미리보기) */
        #top-info-panel {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            margin-bottom: 6px; font-size: 15px; font-weight: bold; z-index: 2; position: relative;
        }
        .next-box {
            display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1);
            padding: 3px 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.3);
        }
        #next-fruit-img {
            width: 22px; height: 22px; border-radius: 50%; border: 1px solid white; background-size: cover; background-position: center;
        }
        
        #game-container { 
            position: relative; width: 85vw; max-width: 390px; height: 70vh; 
            background-color: #000; background-size: cover; background-position: center;
            margin: 0 auto 10px auto; border: 3px solid #555; border-radius: 10px; overflow: hidden; 
            touch-action: none; transition: background-image 0.5s ease;
        }

        /* 7단계 합체 시 화면 테두리 반짝이는 효과 클래스 */
        #game-container.flash-effect {
            animation: flashBorder 0.5s ease infinite alternate;
        }
        @keyframes flashBorder {
            0% { border-color: #555; box-shadow: inset 0 0 0px rgba(255,255,255,0); }
            100% { border-color: #ff007f; box-shadow: inset 0 0 20px #ff007f, 0 0 20px #ff007f; }
        }

        .fruit-drop { 
            position: absolute; border-radius: 50%; 
            border: 2px solid white; 
            box-sizing: border-box; 
            background-size: cover; background-position: center; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: black;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        #watermark { position: absolute; bottom: 8px; right: 10px; color: rgba(255, 255, 255, 0.6); font-size: 11px; z-index: 6; pointer-events: none; }

        .screen-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0, 0.82);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; 
        }
        button { padding: 12px 35px; font-size: 18px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
        .copyright-text { margin-top: 15px; font-size: 11px; color: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>
    <h1>🍉 전가서 수박게임 챌린지 🍉</h1>
    
    <div id="top-info-panel">
        <div>점수: <span id="score">0</span> | 최고: <span id="best-score">0</span></div>
        <div class="next-box">
            <span>다음:</span>
            <div id="next-fruit-img"></div>
        </div>
    </div>

    <audio id="bgm" src="수박배경음악.mp3" loop></audio>
    <audio id="event-sound" src="이벤트효과음.mp3"></audio> <!-- 7단계 합체 시 재생될 효과음 (파일명 맞게 변경 가능) -->

    <div id="game-container">
        <div id="watermark">모카크림의 밤산책</div>
        <div id="start-screen" class="screen-overlay">
            <h2>수박 챌린지 시작</h2>
            <button onclick="firstStartGame()">게임 시작!</button>
            <div class="copyright-text">© 2026 모카크림의밤산책. Fan-made project.</div>
        </div>
        <div id="game-over" class="screen-overlay" style="display: none;">
            <h2>게임 오버 😵</h2>
            <p id="final-score"></p>
            <p id="new-record-notice" style="color: #f1c40f; font-weight: bold; display: none;">🎉 최고 기록 경신! 🎉</p>
            <button onclick="restartGame()">다시 시작하기</button>
        </div>
    </div>

<script>
    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;

    const container = document.getElementById("game-container");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("best-score");
    const nextFruitImgEl = document.getElementById("next-fruit-img");
    const bgm = document.getElementById("bgm");
    const eventSound = document.getElementById("event-sound");

    const fruitTypes = [
        { level: 1, radius: 18, score: 2, img: 'subak1.jpg' },
        { level: 2, radius: 25, score: 4, img: 'subak2.jpg' },
        { level: 3, radius: 33, score: 8, img: 'subak3.jpg' },
        { level: 4, radius: 42, score: 16, img: 'subak4.jpg' },
        { level: 5, radius: 53, score: 32, img: 'subak5.jpg' },
        { level: 6, radius: 66, score: 64, img: 'subak6.jpg' },
        { level: 7, radius: 82, score: 128, img: 'subak7.jpg' }
    ];

    let score = 0;
    let bestScore = localStorage.getItem('subak_best_score') || 0;
    bestScoreEl.innerText = bestScore;

    let isGameRunning = false;
    let currentDropLevel = 0;
    let nextDropLevel = 0;
    let canDrop = true;
    let gameOverTimer = 0;
    
    // 이벤트 짤 관련 변수
    let eventIndex = 1; // 1, 2, 3 순환
    let isEventActive = false;
    let eventTimer = null;

    let engine, runner;
    let ballMap = new Map();

    function updateBackground() {
        // 이벤트 짤이 떠 있는 동안에는 배경 이미지 강제 유지 중이므로 일반 점수 배경은 이벤트가 끝날 때 적용됩니다.
        if (isEventActive) return;
        let bgIdx = (Math.floor(score / 1000) % 5) + 1;
        container.style.backgroundImage = `url('배경${bgIdx}.jpg')`;
    }

    function playBgm() { bgm.pause(); bgm.currentTime = 0; bgm.play().catch(() => {}); }
    function firstStartGame() { document.getElementById("start-screen").style.display = "none"; playBgm(); runGame(); }
    function restartGame() { document.getElementById("game-over").style.display = "none"; playBgm(); runGame(); }

    function initPhysics() {
        if (engine) {
            Runner.stop(runner);
            Engine.clear(engine);
        }

        engine = Engine.create({
            gravity: { x: 0, y: 1.5 },
            enableSleeping: true,
            positionIterations: 10,
            velocityIterations: 10
        });

        const width = container.clientWidth;
        const height = container.clientHeight;
        const wallOptions = { isStatic: true, restitution: 0, friction: 0.2 };

        const ground = Bodies.rectangle(width / 2, height + 30, width * 2, 60, wallOptions);
        const leftWall = Bodies.rectangle(-30, height / 2, 60, height * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height * 2, wallOptions);

        Composite.add(engine.world, [ground, leftWall, rightWall]);

        runner = Runner.create();
        Runner.run(runner, engine);

        Events.on(engine, 'collisionStart', (event) => {
            if (!isGameRunning) return;
            const pairs = event.pairs;

            for (let pair of pairs) {
                const { bodyA, bodyB } = pair;
                if (bodyA.customLevel && bodyB.customLevel && bodyA.customLevel === bodyB.customLevel) {
                    if (bodyA.isMerging || bodyB.isMerging) continue;
                    
                    bodyA.isMerging = true;
                    bodyB.isMerging = true;

                    const level = bodyA.customLevel;
                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;

                    removeBall(bodyA);
                    removeBall(bodyB);

                    score += fruitTypes[level - 1].score * 2;
                    scoreEl.innerText = score;

                    // 최고 점수 실시간 갱신 체크
                    if (score > bestScore) {
                        bestScore = score;
                        bestScoreEl.innerText = bestScore;
                        localStorage.setItem('subak_best_score', bestScore);
                    }

                    // ⭐ 7단계 공이 합쳐졌을 때 이벤트 발생!
                    if (level === 7) {
                        triggerEventCutscene();
                    } else {
                        updateBackground();
                    }

                    if (level < 7) {
                        setTimeout(() => {
                            createBall(midX, midY, fruitTypes[level]);
                        }, 10);
                    }
                }
            }
        });

        Events.on(engine, 'afterUpdate', () => {
            if (!isGameRunning) return;

            let isOverflowing = false;
            const bodies = Composite.allBodies(engine.world);

            for (let body of bodies) {
                if (!body.isStatic && ballMap.has(body.id)) {
                    const el = ballMap.get(body.id);
                    el.style.left = body.position.x + "px";
                    el.style.top = body.position.y + "px";

                    if (body.position.y - body.circleRadius < 35 && Math.abs(body.velocity.y) < 0.2) {
                        isOverflowing = true;
                    }
                }
            }

            if (isOverflowing) {
                gameOverTimer++;
                if (gameOverTimer > 90) {
                    isGameRunning = false;
                    bgm.pause();
                    document.getElementById("final-score").innerText = `최종 점수 : ${score}점`;
                    
                    const newRecordNotice = document.getElementById("new-record-notice");
                    if (score >= bestScore && score > 0) {
                        newRecordNotice.style.display = "block";
                    } else {
                        newRecordNotice.style.display = "none";
                    }

                    document.getElementById("game-over").style.display = "flex";
                }
            } else {
                gameOverTimer = Math.max(0, gameOverTimer - 1);
            }
        });
    }

    // ⭐ 이벤트 짤 연출 함수 (5초간 유지, 순환, 테두리 반짝임 및 효과음)
    function triggerEventCutscene() {
        isEventActive = true;
        
        // 1. 테두리 반짝임 클래스 추가
        container.classList.add("flash-effect");

        // 2. 효과음 재생
        eventSound.currentTime = 0;
        eventSound.play().catch(() => {});

        // 3. 현재 순번에 맞는 이벤트 배경 짤 적용 (event1.jpg, event2.jpg, event3.jpg 순환)
        container.style.backgroundImage = `url('event${eventIndex}.jpg')`;

        // 다음을 위해 인덱스 1 -> 2 -> 3 -> 1 무한 순환 세팅
        eventIndex = (eventIndex % 3) + 1;

        // 기존에 실행 중이던 타이머가 있다면 초기화
        if (eventTimer) clearTimeout(eventTimer);

        // 4. 정확히 5초 후에 원래 상태로 복귀 (게임은 계속 플레이 가능 상태 유지됨)
        eventTimer = setTimeout(() => {
            isEventActive = false;
            container.classList.remove("flash-effect");
            updateBackground(); // 점수대에 맞는 일반 배경으로 복구
        }, 5000);
    }

    function runGame() {
        score = 0;
        scoreEl.innerText = "0";
        isEventActive = false;
        container.classList.remove("flash-effect");
        if (eventTimer) clearTimeout(eventTimer);

        updateBackground();
        
        document.querySelectorAll('.fruit-drop').forEach(el => el.remove());
        ballMap.clear();

        initPhysics();
        isGameRunning = true;
        
        currentDropLevel = getRandomDropLevel();
        nextDropLevel = getRandomDropLevel();
        updateNextFruitUI();

        canDrop = true;
        gameOverTimer = 0;
    }

    function getRandomDropLevel() {
        const rand = Math.random();
        if (rand < 0.35) return 0; else if (rand < 0.75) return 1; else return 2;
    }

    function updateNextFruitUI() {
        nextFruitImgEl.style.backgroundImage = `url('${fruitTypes[nextDropLevel].img}')`;
    }

    container.addEventListener("click", (e) => {
        if (!isGameRunning || !canDrop) return;
        const rect = container.getBoundingClientRect();
        dropBall(e.clientX - rect.left);
    });

    container.addEventListener("touchend", (e) => {
        if (!isGameRunning || !canDrop) return;
        const rect = container.getBoundingClientRect();
        dropBall(e.changedTouches[0].clientX - rect.left);
        e.preventDefault();
    }, {passive: false});

    function dropBall(x) {
        canDrop = false;
        
        // 이번에 떨어질 과일은 현재 대기 중인 과일
        const type = fruitTypes[currentDropLevel];
        const clampX = Math.max(type.radius, Math.min(x, container.clientWidth - type.radius));
        createBall(clampX, type.radius + 5, type);

        // 다음 과일을 현재 과일로 땡기고, 새로운 다음 과일 선정 후 UI 업데이트
        currentDropLevel = nextDropLevel;
        nextDropLevel = getRandomDropLevel();
        updateNextFruitUI();

        setTimeout(() => { canDrop = true; }, 800);
    }

    function createBall(x, y, type) {
        const body = Bodies.circle(x, y, type.radius, {
            restitution: 0.02, 
            friction: 0.1,      
            frictionAir: 0.001,
            slop: 0,             
            density: 0.005
        });

        body.customLevel = type.level;

        const el = document.createElement("div");
        el.className = "fruit-drop";
        el.style.width = (type.radius * 2) + "px";
        el.style.height = (type.radius * 2) + "px";
        el.style.backgroundImage = `url('${type.img}')`;
        container.appendChild(el);

        Composite.add(engine.world, body);
        ballMap.set(body.id, el);
    }

    function removeBall(body) {
        if (ballMap.has(body.id)) {
            ballMap.get(body.id).remove();
            ballMap.delete(body.id);
        }
        Composite.remove(engine.world, body);
    }
</script>
</body>
</html>
