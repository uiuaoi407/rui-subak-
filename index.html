<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>전가서의 수박 게임 챌린지!</title>
    
    <!-- Matter.js 물리 엔진 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
            }
        });
    </script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #000; color: white; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        h1 { margin: 12px 0; font-size: 20px;}
        
        #game-container { 
            position: relative; width: 85vw; max-width: 390px; height: 72vh; 
            background-color: #000; background-size: cover; background-position: center;
            margin: 10px auto; border: 3px solid #555; border-radius: 10px; overflow: hidden; 
            touch-action: none; transition: background-image 0.5s ease;
        }

        .fruit-drop { 
            position: absolute; border-radius: 50%; border: 2px solid white; background-size: cover; background-position: center; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: black;
            transform: translate(-50%, -50%); box-sizing: border-box; pointer-events: none;
        }

        #score-board { font-size: 16px; font-weight: bold; margin-bottom: 12px; z-index: 2; position: relative; }
        #watermark { position: absolute; bottom: 10px; right: 12px; color: rgba(255, 255, 255, 0.6); font-size: 12px; z-index: 6; pointer-events: none; }

        .screen-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0, 0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; 
        }
        button { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
        .copyright-text { margin-top: 15px; font-size: 11px; color: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>
    <h1>🍉 전가서 수박게임 챌린지 🍉</h1>
    <div id="score-board">점수: <span id="score">0</span></div>

    <audio id="bgm" src="수박배경음악.mp3" loop></audio>
    <div id="game-container">
        <div id="watermark">모카크림의 밤산책</div>
        <div id="start-screen" class="screen-overlay">
            <h2>수박 챌린지 시작</h2>
            <button onclick="firstStartGame()">게임 시작!</button>
            <div class="copyright-text">© 2026 모카크림의밤산책. Fan-made project.</div>
        </div>
        <div id="game-over" class="screen-overlay" style="display: none;">
            <h2>게임 오버 😵</h2>
            <p id="final-score"></p>
            <button onclick="restartGame()">다시 시작하기</button>
        </div>
    </div>

<script>
    const { Engine, Render, Runner, Bodies, Composite, Body, Events, Vector } = Matter;

    const container = document.getElementById("game-container");
    const scoreEl = document.getElementById("score");
    const bgm = document.getElementById("bgm");

    const fruitTypes = [
        { level: 1, radius: 18, score: 2, img: 'subak1.jpg' },
        { level: 2, radius: 25, score: 4, img: 'subak2.jpg' },
        { level: 3, radius: 33, score: 8, img: 'subak3.jpg' },
        { level: 4, radius: 42, score: 16, img: 'subak4.jpg' },
        { level: 5, radius: 53, score: 32, img: 'subak5.jpg' },
        { level: 6, radius: 66, score: 64, img: 'subak6.jpg' },
        { level: 7, radius: 82, score: 128, img: 'subak7.jpg' }
    ];

    let score = 0;
    let isGameRunning = false;
    let currentDropLevel = 0;
    let canDrop = true;
    let gameOverTimer = 0;
    
    let engine, runner;
    let ballMap = new Map(); // Matter Body와 DOM Element 연결

    function updateBackground() {
        let bgIdx = (Math.floor(score / 1000) % 5) + 1;
        container.style.backgroundImage = `url('배경${bgIdx}.jpg')`;
    }

    function playBgm() { bgm.pause(); bgm.currentTime = 0; bgm.play().catch(() => {}); }
    function firstStartGame() { document.getElementById("start-screen").style.display = "none"; playBgm(); runGame(); }
    function restartGame() { document.getElementById("game-over").style.display = "none"; playBgm(); runGame(); }

    function initPhysics() {
        if (engine) {
            Runner.stop(runner);
            Engine.clear(engine);
        }

        engine = Engine.create({
            gravity: { x: 0, y: 1.5 } // 시원하게 떨어지도록 중력 보정
        });

        const width = container.clientWidth;
        const height = container.clientHeight;
        const wallOptions = { isStatic: true, restitution: 0, friction: 0.1 };

        // 벽과 바닥 생성 (벽 두께 60px로 두껍게 세워 통과 차단)
        const ground = Bodies.rectangle(width / 2, height + 30, width * 2, 60, wallOptions);
        const leftWall = Bodies.rectangle(-30, height / 2, 60, height * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height * 2, wallOptions);

        Composite.add(engine.world, [ground, leftWall, rightWall]);

        runner = Runner.create();
        Runner.run(runner, engine);

        // 충돌 이벤트 처리 (합치기)
        Events.on(engine, 'collisionStart', (event) => {
            if (!isGameRunning) return;
            const pairs = event.pairs;

            for (let pair of pairs) {
                const { bodyA, bodyB } = pair;
                if (bodyA.customLevel && bodyB.customLevel && bodyA.customLevel === bodyB.customLevel) {
                    if (bodyA.isMerging || bodyB.isMerging) continue;
                    
                    bodyA.isMerging = true;
                    bodyB.isMerging = true;

                    const level = bodyA.customLevel;
                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;

                    // 화면 요소 및 물리 객체 제거
                    removeBall(bodyA);
                    removeBall(bodyB);

                    score += fruitTypes[level - 1].score * 2;
                    scoreEl.innerText = score;
                    updateBackground();

                    // 7단계 두 개 만나면 터지고 끝, 그 이하는 다음 단계 생성
                    if (level < 7) {
                        setTimeout(() => {
                            createBall(midX, midY, fruitTypes[level]);
                        }, 10);
                    }
                }
            }
        });

        // 프레임 이동 및 게임오버 체크
        Events.on(engine, 'afterUpdate', () => {
            if (!isGameRunning) return;

            let isOverflowing = false;
            const bodies = Composite.allBodies(engine.world);

            for (let body of bodies) {
                if (!body.isStatic && ballMap.has(body.id)) {
                    const el = ballMap.get(body.id);
                    el.style.left = body.position.x + "px";
                    el.style.top = body.position.y + "px";

                    // 게임오버 감지 (상단 선 기준 멈춰있는지)
                    if (body.position.y - body.circleRadius < 35 && Math.abs(body.velocity.y) < 0.2) {
                        isOverflowing = true;
                    }
                }
            }

            if (isOverflowing) {
                gameOverTimer++;
                if (gameOverTimer > 90) {
                    isGameRunning = false;
                    bgm.pause();
                    document.getElementById("final-score").innerText = `최종 점수 : ${score}점`;
                    document.getElementById("game-over").style.display = "flex";
                }
            } else {
                gameOverTimer = Math.max(0, gameOverTimer - 1);
            }
        });
    }

    function runGame() {
        score = 0;
        scoreEl.innerText = "0";
        updateBackground();
        
        // 기존 렌더링 노드 싹 정리
        document.querySelectorAll('.fruit-drop').forEach(el => el.remove());
        ballMap.clear();

        initPhysics();
        isGameRunning = true;
        currentDropLevel = getRandomDropLevel();
        canDrop = true;
        gameOverTimer = 0;
    }

    function getRandomDropLevel() {
        const rand = Math.random();
        if (rand < 0.35) return 0; else if (rand < 0.75) return 1; else return 2;
    }

    container.addEventListener("click", (e) => {
        if (!isGameRunning || !canDrop) return;
        const rect = container.getBoundingClientRect();
        dropBall(e.clientX - rect.left, currentDropLevel);
    });

    container.addEventListener("touchend", (e) => {
        if (!isGameRunning || !canDrop) return;
        const rect = container.getBoundingClientRect();
        dropBall(e.changedTouches[0].clientX - rect.left, currentDropLevel);
        e.preventDefault();
    }, {passive: false});

    function dropBall(x, levelIdx) {
        canDrop = false;
        const type = fruitTypes[levelIdx];
        const clampX = Math.max(type.radius, Math.min(x, container.clientWidth - type.radius));
        createBall(clampX, type.radius + 5, type);
        setTimeout(() => { canDrop = true; currentDropLevel = getRandomDropLevel(); }, 800);
    }

    function createBall(x, y, type) {
        // 물리 객체 (단단한 당구공 성질)
        const body = Bodies.circle(x, y, type.radius, {
            restitution: 0.05, // 튀지 않음
            friction: 0.02,    // 표면 마찰 적게 -> 또르르 잘 굴러감
            frictionAir: 0.001,// 공기 저항 최소화
            density: 0.005
        });

        body.customLevel = type.level;

        // DOM 표시 객체
        const el = document.createElement("div");
        el.className = "fruit-drop";
        el.style.width = (type.radius * 2) + "px";
        el.style.height = (type.radius * 2) + "px";
        el.style.backgroundImage = `url('${type.img}')`;
        container.appendChild(el);

        Composite.add(engine.world, body);
        ballMap.set(body.id, el);
    }

    function removeBall(body) {
        if (ballMap.has(body.id)) {
            ballMap.get(body.id).remove();
            ballMap.delete(body.id);
        }
        Composite.remove(engine.world, body);
    }
</script>
</body>
</html>
